services:
  - type: web
    name: hemdat-mishnah
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: game-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SCHOOL_CODE
        sync: false
      - key: DATABASE_PATH
        value: /data/game.db
      - key: COOKIE_SECURE
        value: "1"
      - key: SEED_DEMO
        value: "1"
